name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, attest, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify release source
        run: npm run check
      - name: Build release artifacts
        shell: bash
        run: |
          mkdir release
          package_file="$(npm pack --ignore-scripts --silent)"
          mv "$package_file" "release/mailbridge-mcp-${GITHUB_REF_NAME}.tgz"
          npm sbom --sbom-format cyclonedx > release/mailbridge-sbom.cdx.json
          (
            cd release
            sha256sum "mailbridge-mcp-${GITHUB_REF_NAME}.tgz" mailbridge-sbom.cdx.json > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release/mailbridge-mcp-${{ github.ref_name }}.tgz
            release/mailbridge-sbom.cdx.json
      - name: Preserve release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mailbridge-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 90
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" release/*
          --verify-tag --generate-notes --title "MailBridge MCP ${{ github.ref_name }}"
