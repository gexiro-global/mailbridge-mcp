name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build immutable artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Set up Java for SPDX validation
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify tag, package version, and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node --input-type=commonjs -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" != "${GITHUB_SHA}" ]]; then
            echo "The release tag does not resolve to the workflow commit." >&2
            exit 1
          fi
          git fetch --no-tags --force origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "Tagged commit ${GITHUB_SHA} is not on origin/main." >&2
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify release source
        run: npm run check

      - name: Build release artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir release

          runtime_name="mailbridge-mcp-${GITHUB_REF_NAME}-runtime-npm.tgz"
          source_name="mailbridge-mcp-${GITHUB_REF_NAME}-source.tar.gz"
          cyclonedx_name="mailbridge-mcp-${GITHUB_REF_NAME}-sbom.cdx.json"
          spdx_name="mailbridge-mcp-${GITHUB_REF_NAME}-sbom.spdx.json"

          package_file="$(npm pack --ignore-scripts --silent)"
          mv -- "${package_file}" "release/${runtime_name}"
          git archive \
            --format=tar.gz \
            --prefix="mailbridge-mcp-${GITHUB_REF_NAME}-source/" \
            --output="release/${source_name}" \
            "${GITHUB_SHA}"
          npm sbom --sbom-format cyclonedx > "release/${cyclonedx_name}"
          npm sbom --sbom-format spdx > "release/${spdx_name}"
          node scripts/normalize-spdx.mjs --input "release/${spdx_name}"

          node scripts/validate-sboms.mjs \
            --cyclonedx "release/${cyclonedx_name}" \
            --spdx "release/${spdx_name}" \
            --version "$(node --input-type=commonjs -p "require('./package.json').version")"

          (
            cd release
            sha256sum "${runtime_name}" "${source_name}" "${cyclonedx_name}" "${spdx_name}" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Validate SBOM specifications
        shell: bash
        run: |
          set -euo pipefail
          version="$(node --input-type=commonjs -p "require('./package.json').version")"
          docker run --rm --volume "$PWD/release:/work:ro" \
            cyclonedx/cyclonedx-cli@sha256:252c2e26f468c25fea1e63ecde1bc3198ad6e9dbb57f5ed3236bddcb2281b3a7 \
            validate \
            --input-file "/work/mailbridge-mcp-v${version}-sbom.cdx.json" \
            --input-version v1_5 \
            --fail-on-errors
          curl --fail --location --retry 3 --output /tmp/spdx-tools.jar \
            https://repo1.maven.org/maven2/org/spdx/tools-java/2.0.7/tools-java-2.0.7-jar-with-dependencies.jar
          echo "bf99a8b2ffbea238c1451c6b4be568870f18b4aac93d0dbff755f2b0b7ce43f3  /tmp/spdx-tools.jar" | sha256sum -c -
          java -jar /tmp/spdx-tools.jar Verify "release/mailbridge-mcp-v${version}-sbom.spdx.json"

      - name: Verify exact artifacts as an external receiver
        run: >-
          node scripts/verify-release-artifact.mjs
          --release-dir release
          --tag "${GITHUB_REF_NAME}"

      - name: Preserve verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mailbridge-release-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Attest and publish verified artifacts
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure required reviewers and tag deployment protection for this environment
    # in repository settings before enabling public release publication.
    environment:
      name: github-release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Re-check release identity after environment approval
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag still resolves to an origin/main commit
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node --input-type=commonjs -p "require('./package.json').version")"
          [[ "${GITHUB_REF_NAME}" == "v${package_version}" ]]
          [[ "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" == "${GITHUB_SHA}" ]]
          git fetch --no-tags --force origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main

      - name: Download verified release bundle
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: mailbridge-release-${{ github.ref_name }}
          path: release

      - name: Re-verify downloaded checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release
            sha256sum -c SHA256SUMS
          )

      - name: Attest release provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            release/mailbridge-mcp-${{ github.ref_name }}-runtime-npm.tgz
            release/mailbridge-mcp-${{ github.ref_name }}-source.tar.gz
            release/mailbridge-mcp-${{ github.ref_name }}-sbom.cdx.json
            release/mailbridge-mcp-${{ github.ref_name }}-sbom.spdx.json
            release/SHA256SUMS

      - name: Attest runtime SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release/mailbridge-mcp-${{ github.ref_name }}-runtime-npm.tgz
          sbom-path: release/mailbridge-mcp-${{ github.ref_name }}-sbom.spdx.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "release/mailbridge-mcp-${GITHUB_REF_NAME}-runtime-npm.tgz" \
            "release/mailbridge-mcp-${GITHUB_REF_NAME}-source.tar.gz" \
            "release/mailbridge-mcp-${GITHUB_REF_NAME}-sbom.cdx.json" \
            "release/mailbridge-mcp-${GITHUB_REF_NAME}-sbom.spdx.json" \
            "release/SHA256SUMS" \
            --verify-tag \
            --generate-notes \
            --title "MailBridge MCP ${GITHUB_REF_NAME}"
