name: Bug report
description: Report a reproducible defect in the synthetic MailBridge distribution.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, real email, private hostnames, or production logs.
  - type: input
    id: version
    attributes:
      label: MailBridge version
      placeholder: v1.1.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest reproduction using only repository demo data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, real email, tokens, private hostnames, and production data.
          required: true
