# Production template. It is intentionally fail-closed until the OAuth
# placeholders and the explicit subject allowlist below are replaced.
server:
  name: mailbridge-mcp
  version: 2.1.0
  bind_host: 0.0.0.0
  port: 3091
  public_base_url: https://mailbridge.example.invalid
  allowed_hosts:
    - mailbridge.example.invalid
  allowed_origins:
    - https://chatgpt.com
  request_max_bytes: 16777216
  rate_limit:
    window_ms: 60000
    max_requests: 60

auth:
  mode: oauth
  issuer: https://identity.example.invalid/
  audience: https://mailbridge.example.invalid
  jwks_uri: https://identity.example.invalid/.well-known/jwks.json
  scopes:
    - mail.read
    - mail.health.read
    - mail.settings.write
    - mail.send
  # REQUIRED: add only the exact OAuth subjects allowed to use this instance.
  # An empty allowlist deliberately prevents a production start.
  allowed_subjects: []

privacy:
  snippet_max_chars: 320
  body_max_chars: 20000
  source_max_bytes: 5242880
  attachment_max_bytes: 26214400
  audit_retention_days: 30

app:
  enabled: true
  database_path: /app/runtime/data/mailbridge.sqlite
  widget_origin: https://web-sandbox.oaiusercontent.com
  credential_master_key_secret: mailbridge_credential_master_key
  credential_key_version: v1
  user_key_mode: oauth_subject
  user_key_hmac_secret: mailbridge_user_key_hmac
  fixed_owner_user_key_secret: mailbridge_fixed_owner_user_key
  message_id_hmac_secret: mailbridge_id_hmac_key
  settings_session_ttl_ms: 300000
  max_mailboxes_per_user: 50
  settings_rate_limit:
    window_ms: 60000
    max_requests: 60

panel:
  enabled: false
  bind_host: 127.0.0.1
  port: 8792
  allowed_hosts:
    - 127.0.0.1
    - localhost
  allowed_origins:
    - https://127.0.0.1:8792
    - https://localhost:8792
  operator_username: operator
  password_secret: panel_operator_password
  session_key_secret: panel_session_hmac_key
  session_timeout_ms: 1800000
  secure_cookie: true
  request_max_bytes: 65536
  audit_log_path: ./runtime/data/admin-audit.jsonl
  rate_limit:
    window_ms: 60000
    max_requests: 60
    max_login_attempts: 5

# Apps SDK mailbox credentials are added through the user-scoped settings UI.
# Static mailbox entries are optional and remain empty by default.
mailboxes: []
